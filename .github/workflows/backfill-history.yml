name: Backfill History (run once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build full history file
        run: python scripts/backfill_history.py
      - name: Commit the seeded history file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/history-stats.json
          if git diff --cached --quiet; then
            echo "No history file changes to commit."
          else
            git commit -m "Seed historical record (one-time backfill)"
            git push
          fi
