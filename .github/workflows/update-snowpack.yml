name: Update Snowpack Status
on:
  workflow_dispatch:
  schedule:
    # 13:15 UTC = 6:15 AM Arizona time. Arizona is UTC-7 year-round.
    - cron: '15 13 * * *'
permissions:
  contents: write
jobs:
  update-waterlinewest-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Update Lees Ferry Flow
        run: python scripts/update_lees_ferry.py
      - name: Update Lake Powell elevation
        run: python scripts/update_lake_powell.py
      - name: Update Tributary inflow
        run: python scripts/update_tributary_inflow.py
      - name: Append daily history
        run: python scripts/update_history_append.py
      - name: Commit updated JSON if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowpack-status.json/history-stats.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Update Lees Ferry, Lake Powell, and tributary inflow data"
            git push
          fi
