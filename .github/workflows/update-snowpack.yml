name: Update Snowpack Status
on:
  workflow_dispatch:
  schedule:
    # 13:15 UTC = 6:15 AM Arizona time. Arizona is UTC-7 year-round.
    - cron: '15 13 * * *'
permissions:
  contents: write
jobs:
  update-waterlinewest-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Update snowpack basins
        continue-on-error: true        # a snowpack/NRCS hiccup must not block the core gauges
        run: python scripts/update_snowpack_basins.py
      - name: Update Lees Ferry Flow
        run: python scripts/update_lees_ferry.py
      - name: Update Lake Powell elevation
        run: python scripts/update_lake_powell.py
      - name: Update Dam Release (Glen Canyon power release)
        run: python scripts/update_dam_release.py
      - name: Update Grand Canyon flow + vs-median
        run: python scripts/update_grand_canyon.py
      - name: Update Lake Mead
        run: python scripts/update_lake_mead.py
      - name: Update lower reservoirs (Mohave & Havasu)
        run: python scripts/update_lower_reservoirs.py
        continue-on-error: true
      - name: Update Tributary inflo
        run: python scripts/update_tributary_inflow.py
      - name: Append daily history
        run: python scripts/update_history_append.py
      - name: Commit updated JSON if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/snowpack-status.json docs/history-stats.json docs/snowpack-basins.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Update Lees Ferry, Lake Powell, tributary, Mead, snowpack basins, and history data"
            git push
          fi
